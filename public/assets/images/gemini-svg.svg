<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 220" fill="none" stroke="#60a5fa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="100%" height="auto" preserveAspectRatio="none">
  <defs>
    <!-- Trær definert som gjenbrukbare elementer -->
    <g id="tree">
      <line x1="0" y1="0" x2="0" y2="-28" />
      <circle cx="0" cy="-35" r="9" />
    </g>
    <g id="small-tree">
      <line x1="0" y1="0" x2="0" y2="-20" />
      <circle cx="0" cy="-25" r="6" />
    </g>

    <!-- Bygningsklynge 1 -->
    <g id="cluster-a">
      <!-- Bygg 1: Liten blokk -->
      <rect x="0" y="-80" width="34" height="80" />
      <line x1="10" y1="-70" x2="10" y2="-62" />
      <line x1="24" y1="-70" x2="24" y2="-62" />
      <line x1="10" y1="-50" x2="10" y2="-42" />
      <line x1="24" y1="-50" x2="24" y2="-42" />
      <line x1="10" y1="-30" x2="10" y2="-22" />
      <line x1="24" y1="-30" x2="24" y2="-22" />

      <!-- Bygg 2: Høy tårnblokk med antenne -->
      <rect x="34" y="-140" width="46" height="140" />
      <line x1="57" y1="-140" x2="57" y2="-158" />
      <rect x="42" y="-130" width="10" height="12" />
      <rect x="62" y="-130" width="10" height="12" />
      <rect x="42" y="-105" width="10" height="12" />
      <rect x="62" y="-105" width="10" height="12" />
      <rect x="42" y="-80" width="10" height="12" />
      <rect x="62" y="-80" width="10" height="12" />
      <rect x="42" y="-55" width="10" height="12" />
      <rect x="62" y="-55" width="10" height="12" />

      <!-- Bygg 3: Midtstilt blokk -->
      <rect x="80" y="-100" width="38" height="100" />
      <line x1="90" y1="-90" x2="90" y2="-30" stroke-dasharray="8 6" />
      <line x1="108" y1="-90" x2="108" y2="-30" stroke-dasharray="8 6" />

      <!-- Trær -->
      <use href="#tree" x="130" y="0" />
      <use href="#small-tree" x="146" y="0" />
    </g>

    <!-- Bygningsklynge 2: Skyskrapere i vinkel -->
    <g id="cluster-b">
      <!-- Trappetrinn-bygg -->
      <path d="M 0 0 L 0 -115 L 24 -115 L 24 -155 L 56 -155 L 56 -115 L 75 -115 L 75 0" />
      <line x1="34" y1="-145" x2="34" y2="-125" stroke-dasharray="6 4" />
      <line x1="46" y1="-145" x2="46" y2="-125" stroke-dasharray="6 4" />
      <line x1="12" y1="-100" x2="12" y2="-30" stroke-dasharray="6 5" />
      <line x1="65" y1="-100" x2="65" y2="-30" stroke-dasharray="6 5" />

      <!-- Slankt nabobygg -->
      <rect x="75" y="-130" width="32" height="130" />
      <line x1="85" y1="-120" x2="85" y2="-40" stroke-dasharray="6 4" />
      <line x1="97" y1="-120" x2="97" y2="-40" stroke-dasharray="6 4" />

      <!-- Lite tilbygg med tre -->
      <rect x="107" y="-60" width="28" height="60" />
      <line x1="121" y1="-50" x2="121" y2="-20" stroke-dasharray="6 4" />
      <use href="#tree" x="148" y="0" />
    </g>

    <!-- Bygningsklynge 3: Diagonal profil -->
    <g id="cluster-c">
      <rect x="0" y="-95" width="35" height="95" />
      <line x1="10" y1="-85" x2="10" y2="-25" stroke-dasharray="7 5" />
      <line x1="25" y1="-85" x2="25" y2="-25" stroke-dasharray="7 5" />

      <path d="M 35 0 L 35 -135 L 65 -155 L 65 0" />
      <line x1="45" y1="-125" x2="45" y2="-30" stroke-dasharray="8 6" />
      <line x1="55" y1="-135" x2="55" y2="-30" stroke-dasharray="8 6" />

      <path d="M 65 0 L 65 -155 L 95 -135 L 95 0" />
      <line x1="75" y1="-135" x2="75" y2="-30" stroke-dasharray="8 6" />
      <line x1="85" y1="-125" x2="85" y2="-30" stroke-dasharray="8 6" />

      <use href="#small-tree" x="110" y="0" />
      <use href="#tree" x="125" y="0" />
    </g>
  </defs>

  <!-- Grunnlinje og repetert byrekke langs bunnen med skalert kompakt størrelse og rikelig takhøyde -->
  <g transform="translate(0, 210)">
    <line x1="0" y1="0" x2="1600" y2="0" stroke-width="2.5" />

    <g transform="scale(0.65)">
      <use href="#cluster-a" x="0" y="0" />
      <use href="#cluster-b" x="160" y="0" />
      <use href="#cluster-c" x="330" y="0" />
      <use href="#cluster-a" x="490" y="0" />
      <use href="#cluster-b" x="650" y="0" />
      <use href="#cluster-c" x="820" y="0" />
      <use href="#cluster-a" x="980" y="0" />
      <use href="#cluster-b" x="1140" y="0" />
      <use href="#cluster-c" x="1310" y="0" />
      <use href="#cluster-a" x="1470" y="0" />
      <use href="#cluster-b" x="1630" y="0" />
      <use href="#cluster-c" x="1800" y="0" />
      <use href="#cluster-a" x="1960" y="0" />
      <use href="#cluster-b" x="2120" y="0" />
      <use href="#cluster-c" x="2290" y="0" />
      <use href="#cluster-a" x="2450" y="0" />
    </g>
  </g>
</svg>
